<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<head>
    <script>
        var ezyvector = {};
    </script>
</head>

<body>
<div layout:fragment="content" class="row">
    <div class="col-md-12">
        <strong class="text-info">[[#{save_setting_hot_key_guide}]]</strong>
    </div>
    <div class="col-md-12">
        <form id="updateCollectionsForm" onsubmit="return false;">
            <div class="col-12 mt-3"></div>
            <div class="form-group row">
                <label for="vectorCollectionsApiKey" class="col-sm-3 col-form-label">
                    [[#{vector_collections_api_key}]]
                </label>
                <div class="col-lg-7 col-md-6">
                    <div class="d-flex align-items-center">
                        <input type="password" name="vectorCollectionsApiKey" id="vectorCollectionsApiKey"
                               class="form-control" th:placeholder="#{vector_collections_api_key}"
                               th:value="${vectorCollectionsApiKey}"
                               autocomplete="new-password">
                        <button type="button" class="btn btn-info" id="showVectorCollectionsApiKeyButton" tabindex="-1"
                                onclick="ezyadmin.togglePasswordVisible('vectorCollectionsApiKey', 'showVectorCollectionsApiKeyButton', 'hideVectorCollectionsApiKeyButton')">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button type="button" class="btn btn-secondary d-none" id="hideVectorCollectionsApiKeyButton" tabindex="-1"
                                onclick="ezyadmin.togglePasswordVisible('vectorCollectionsApiKey', 'showVectorCollectionsApiKeyButton', 'hideVectorCollectionsApiKeyButton')">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                        <button type="button" class="btn btn-secondary" id="randomVectorCollectionsApiKeyButton" tabindex="-1"
                                onclick="ezyvector.randomVectorCollectionsApiKey();">
                            <i class="fas fa-random"></i>
                        </button>
                    </div>
                </div>
                <label id="vectorCollectionsApiKeyErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="vectorCollectionsApiKey">
                    <i class="far fa-times-circle"></i> <span id="vectorCollectionsApiKeyError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-2 mb-2">
                    <button type="button" class="btn btn-primary btn-block"
                            id="saveezyvectorSettingButton"
                            onclick="ezyvector.saveSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-5"></div>
            </div>
        </form>
    </div>
</div>

<script layout:fragment="scripts" th:inline="javascript">
/*<![CDATA[*/
ezyadmin.messages.save_successfully = /*[[#{save_successfully}]]*/;
/*]]>*/

ezyvector.randomVectorCollectionsApiKey = function() {
    $('#vectorCollectionsApiKey').val(ezyadmin.randomString(64));
}

ezyvector.saveSettings = function() {
    var formData = ezyadmin.formDataToObject('updateCollectionsForm');
    $.ajax({
        type: 'PUT',
        url: '/ezyvector/api/v1/settings/collections',
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast('bg-success', ezyadmin.messages.save_successfully);
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

ezyvector.handleSettingsSaveShortcut = function(event) {
    var $form = $('#updateCollectionsForm');
    var $saveButton = $('#saveezyvectorSettingButton');
    if (!$form.length || !$saveButton.length) {
        return;
    }

    var key = event.key ? event.key.toLowerCase() : '';
    var modifierPressed = event.ctrlKey || event.metaKey;
    if (key !== 's' || !modifierPressed) {
        return;
    }

    var $activeElement = $(':focus');
    var activeElement = $activeElement[0];
    var focusIsFormInput = $activeElement.length &&
        $.contains($form[0], activeElement) &&
        ($activeElement.is('input, textarea, select') || $activeElement.prop('isContentEditable'));
    var focusIsBlank = !$activeElement.length || $activeElement.is('body');

    if (!focusIsBlank && !focusIsFormInput) {
        return;
    }

    event.preventDefault();
    $saveButton.trigger('click');
};

$(document).on('keydown', ezyvector.handleSettingsSaveShortcut);
</script>
</body>
</html>
